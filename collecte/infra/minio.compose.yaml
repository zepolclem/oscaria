# MinIO single-node pour Coolify (stockage images dataset OscarIA).
# Coolify > Projet oscaria-data > + New Resource > Docker Compose -> coller ce fichier.
# Coolify génère SERVICE_USER_MINIO / SERVICE_PASSWORD_MINIO (secrets persistés) et te laisse
# assigner un domaine au port 9000 (API S3) et 9001 (console).
services:
  minio:
    image: minio/minio:RELEASE.2025-04-08T15-41-24Z   # version communautaire AVEC console
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=${SERVICE_USER_MINIO}
      - MINIO_ROOT_PASSWORD=${SERVICE_PASSWORD_MINIO}
      # https:// littéral + SERVICE_FQDN_* (host nu) : MinIO exige le scheme, ET Coolify génère les
      # labels Traefik Host() à partir du FQDN nu. Utiliser SERVICE_URL_* (avec scheme) casse le Host().
      - MINIO_SERVER_URL=https://${SERVICE_FQDN_MINIO_9000}          # endpoint S3
      - MINIO_BROWSER_REDIRECT_URL=https://${SERVICE_FQDN_MINIO_9001} # console
    volumes:
      - minio-data:/data
      - /data/coolify/ssl/coolify-ca.crt:/etc/ssl/certs/coolify-ca.crt:ro
    restart: unless-stopped

  # Init : crée le bucket 'oscaria-images' (privé) au 1er déploiement, puis s'arrête.
  createbucket:
    image: minio/mc:RELEASE.2025-04-08T15-39-49Z
    depends_on:
      - minio
    environment:
      - MINIO_ROOT_USER=${SERVICE_USER_MINIO}
      - MINIO_ROOT_PASSWORD=${SERVICE_PASSWORD_MINIO}
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 \"$$MINIO_ROOT_USER\" \"$$MINIO_ROOT_PASSWORD\"; do echo 'wait minio'; sleep 3; done;
      mc mb -p local/oscaria-images;
      mc anonymous set none local/oscaria-images;
      echo 'bucket oscaria-images prêt';
      "
    restart: "no"

volumes:
  minio-data:
