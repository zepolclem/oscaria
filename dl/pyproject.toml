[project]
name = "oscaria-dl"
version = "0.1.0"
description = "OscarIA — pilier Plaques : détection + floutage (DL vision)"
requires-python = ">=3.12"
dependencies = [
    "torch>=2.2",
    "torchvision>=0.17",
    "numpy>=1.26",
    "pandas>=2.2",
    "matplotlib>=3.8",
    "scikit-learn>=1.4",
    "pillow>=10.0",
    "jupyterlab>=4.0",
    "ipykernel>=6.29",
    "defusedxml>=0.7.1",
]

# Marqueur `sys_platform == 'linux'` : macOS reste sur PyPI, donc MPS reste disponible pour
# l'entraînement local ; Linux prend la variante CPU, ce qui allège l'image de l'application.
# Sur une machine Linux avec GPU NVIDIA, le basculement CUDA se fait après le `sync` — voir
# `device.py:recommend_install()`. Commentaire détaillé dans `app/pyproject.toml`.
[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", marker = "sys_platform == 'linux'" },
]
torchvision = [
    { index = "pytorch-cpu", marker = "sys_platform == 'linux'" },
]

[tool.uv]
package = false
